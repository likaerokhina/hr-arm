  <div class="mock-nav">

  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark">HR</span>
        Рекрутер
      </div>
      <nav>
        <a href="dashboard.html" class="active">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Вакансии
        </a>
        <a href="resume-bank-calendar.html">
          <svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Банк резюме
        </a>
        <a href="#">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Настройки
        </a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <div class="breadcrumb breadcrumb--back">
            <a href="dashboard.html">← К списку вакансий</a>
          </div>
          <h1>DevOps Engineer</h1>
          <div class="breadcrumb">СберTech · FinTech, Kubernetes</div>
        </div>
        <div class="topbar__actions">
          <span class="status-pill status-pill--review"><span class="status-dot"></span>На проверке</span>
        </div>
      </header>

      <nav class="vacancy-tabs" aria-label="Раздел вакансии">
        <a href="vacancy.html" class="vacancy-tabs__item">Воронка</a>
        <a href="vacancy-card.html" class="vacancy-tabs__item active">История</a>
      </nav>

      <div class="content content--vacancy-card">
        <div class="send-stats send-stats--history" data-mock-history-stats></div>

        <div class="list-controls list-controls--history">
          <div class="list-controls__row">
            <div class="list-controls__block">
              <span class="list-controls__label">Кандидат</span>
              <div class="control-shell control-shell--sort">
                <select id="timeline-filter" class="control-select" data-mock-timeline-select>
                  <option value="all">Все кандидаты</option>
                  <option value="novikov">Новиков</option>
                  <option value="sidorov">Сидоров</option>
                  <option value="kozlov">Козлов</option>
                  <option value="lebedev">Лебедев</option>
                  <option value="morozov">Морозов</option>
                  <option value="orlov">Орлов</option>
                  <option value="fedorov">Фёдоров</option>
                </select>
              </div>
            </div>
            <div class="list-controls__block">
              <div class="control-shell">
                <label class="filter-toggle">
                  <input type="checkbox" data-mock-show-rejects>
                  <span class="filter-toggle__ui" aria-hidden="true"></span>
                  <span class="filter-toggle__text">Показать отказы</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <section class="vcard-panel vcard-panel--history">
          <div class="vcard-panel__head">
            <h2>Лента событий</h2>
            <p class="vcard-panel__hint" data-mock-timeline-count></p>
          </div>
          <ol class="timeline" data-mock-timeline-render></ol>
        </section>
      </div>
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="mock.js"></script>
</body>
</html>
